<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064e0" />
      <stop offset="50%" stop-color="#0081fb" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0081fb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0081fb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded pill/badge (optional transparent canvas) -->
  <rect width="48" height="48" rx="12" fill="#0b1120" />
  <rect width="48" height="48" rx="12" stroke="url(#metaGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Meta Official Infinity Ribbon Path -->
  <path 
    d="M33.6 14.5c-3.1 0-5.7 1.6-8.1 4.5c-2.4-2.9-5-4.5-8.1-4.5C11.1 14.5 6 19.3 6 25.1c0 6.8 5.4 12.4 11.4 12.4c3.4 0 6.1-1.6 8.2-4.6c2.1 3 4.8 4.6 8.2 4.6c6 0 11.4-5.6 11.4-12.4c0-5.8-5.1-10.6-11.6-10.6zm-16.2 19.8c-4.4 0-7.8-4.2-7.8-9.2c0-3.9 2.8-7.2 6.8-7.2c2.7 0 4.9 1.8 6.9 4.8c-2.2 4.1-4.5 11.6-5.9 11.6zm16.4 0c-1.4 0-3.7-7.5-5.9-11.6c2-3 4.2-4.8 6.9-4.8c4 0 6.8 3.3 6.8 7.2c0 5-3.4 9.2-7.8 9.2z" 
    fill="url(#metaGrad)"
    filter="url(#glow)"
  />

  <!-- Graph API Interconnected Nodes Overlay -->
  <!-- Top Right Node -->
  <circle cx="39" cy="11" r="3" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1" />
  <line x1="34" y1="14.5" x2="39" y2="11" stroke="#00c6ff" stroke-width="1.2" stroke-dasharray="1 1" />
  
  <!-- Left Node -->
  <circle cx="9" cy="12" r="2.5" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1" />
  <line x1="13.5" y1="15" x2="9" y2="12" stroke="#00c6ff" stroke-width="1.2" stroke-dasharray="1 1" />

  <!-- Center Graph Hub Node -->
  <circle cx="24" cy="24" r="2" fill="#ffffff" />
</svg>
